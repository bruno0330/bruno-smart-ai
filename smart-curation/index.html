<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>遠見智能策展部</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#16325c; --navy-deep:#0d2038; --navy-soft:#4a6483;
    --rose:#a9746e; --rose-light:#d9b8a9;
    --cyan-1:#38bdf8; --cyan-2:#0284c7;
    --panel-bg:#eef1f5; --paper:#fafbfc; --line:#dde3ea;
    --text:#2a2f36; --text-soft:#6b7280;
    --esg:#00a153; --esg-deep:#00733b; --esg-soft:#4a8a6a; --esg-tint:#eafaf1; --esg-line:#b3e6cc;
    /* 「資料庫切換」用：--accent 系列預設＝遠見線上讀（navy），body.source-esg 會整組換成 ESG 綠。
       其他既有規則都改引用 --accent／--accent-deep／--accent-soft，不用另外幫每個規則寫兩份。 */
    --accent:var(--navy); --accent-deep:var(--navy-deep); --accent-soft:var(--navy-soft);
    --hover-tint:#dfe5ec; --field-border:#ccd3dc; --badge-bg:#e4e9f0;
  }
  body.source-esg{
    --accent:var(--esg); --accent-deep:var(--esg-deep); --accent-soft:var(--esg-soft);
    --panel-bg:var(--esg-tint); --line:var(--esg-line);
    --hover-tint:#d6f0e2; --field-border:var(--esg-line); --badge-bg:#d6f0e2;
  }
  *{ box-sizing:border-box; }
  body{ margin:0; background:#fdfcfb; color:var(--text); font-family:"Noto Sans TC",sans-serif; transition:background .2s ease; }
  .topbar{ height:4px; background:var(--accent); transition:background .2s ease; }
  .page-header{
    max-width:1240px; margin:0 auto; padding:16px 24px 0;
    display:flex; align-items:center; justify-content:space-between;
  }
  .back-link{ font-size:13px; font-weight:500; text-decoration:none; color:var(--cyan-2); }
  .back-link:hover{ color:var(--cyan-1); }
  .brand{ font-size:11px; color:var(--text-soft); letter-spacing:.04em; }

  #gvm-root{
    max-width:1240px; margin:0 auto; padding:20px 24px 60px;
  }
  .gvm-masthead{ text-align:center; margin-bottom:28px; }
  .gvm-masthead-eyebrow{
    font-size:11px; letter-spacing:.3em; color:var(--rose); text-transform:uppercase;
    font-weight:700; margin-bottom:8px;
  }
  .gvm-masthead-title{
    font-family:"Noto Serif TC",serif; font-weight:900; font-size:26px;
    color:var(--navy-deep); margin:0 0 6px; letter-spacing:.03em;
  }
  .gvm-masthead-sub{ font-size:12.5px; color:var(--text-soft); margin-bottom:20px; }

  .gvm-source-switcher{ display:flex; gap:8px; justify-content:center; margin-bottom:12px; }
  .gvm-source-btn{
    padding:10px 24px; border-radius:999px; font-size:13.5px; font-weight:700;
    border:1.5px solid var(--line); background:#fff; color:var(--text-soft);
    display:inline-flex; align-items:center; gap:8px; cursor:pointer; font-family:inherit;
    transition:background .15s ease, border-color .15s ease, color .15s ease, box-shadow .15s ease, transform .08s ease;
  }
  .gvm-source-btn:hover:not(.active){ border-color:var(--accent-soft); color:var(--accent); background:#f6f7f9; }
  .gvm-source-btn:active{ transform:scale(.96); }
  .gvm-source-btn.active{ background:var(--accent); color:#fff; border-color:var(--accent); box-shadow:0 6px 16px rgba(0,0,0,.15); }
  .gvm-source-btn .dot{ width:6px; height:6px; border-radius:50%; background:currentColor; opacity:.6; }
  .gvm-source-caption{ font-size:11.5px; color:var(--text-soft); }

  .gvm-draft-banner{
    display:none; max-width:1240px; margin:0 auto 18px; padding:14px 18px;
    background:#fff8e6; border:1px solid #f0d9a0; border-radius:6px;
    align-items:center; gap:12px; flex-wrap:wrap; font-size:13px; color:#6b5320;
  }
  .gvm-draft-banner.show{ display:flex; }
  .gvm-draft-banner .grow{ flex:1 1 260px; }
  .gvm-draft-banner b{ font-weight:700; }
  .gvm-draft-btn{
    padding:7px 15px; border-radius:3px; font-size:12.5px; font-weight:700;
    cursor:pointer; font-family:inherit; border:1px solid #d8b25f; background:#fff; color:#6b5320;
  }
  .gvm-draft-btn:hover{ background:#fdf1d6; }
  .gvm-draft-btn.primary{ background:#b98c2a; border-color:#b98c2a; color:#fff; }
  .gvm-draft-btn.primary:hover{ background:#a37a20; }

  .gvm-layout{ display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:22px; align-items:start; }
  @media (max-width:900px){ .gvm-layout{ grid-template-columns:1fr; } }

  .gvm-panel{ background:var(--panel-bg); border-radius:6px; padding:20px; }
  .gvm-panel + .gvm-panel{ margin-top:18px; }
  .gvm-panel-label{
    font-size:11px; letter-spacing:.2em; color:var(--accent); text-transform:uppercase;
    font-weight:700; margin-bottom:12px;
  }

  .gvm-form{ display:flex; flex-wrap:wrap; gap:10px; }
  .gvm-field{ display:flex; flex-direction:column; gap:4px; }
  .gvm-field label{ font-size:11px; color:var(--text-soft); }
  .gvm-field input, .gvm-field select, #gvm-focus-year{
    padding:8px 10px; border:1px solid var(--field-border); border-radius:3px; font-size:13.5px;
    font-family:inherit; color:var(--text); background:#fff;
  }
  .gvm-field input:focus, .gvm-field select:focus{ outline:none; border-color:var(--accent); }
  .gvm-keyword-field{ flex:1 1 160px; }

  .gvm-btn{
    background:var(--accent); color:#fff; border:none; padding:9px 20px; border-radius:3px;
    font-size:13.5px; font-weight:700; cursor:pointer; align-self:flex-end;
  }
  .gvm-btn:hover:not(:disabled){ background:var(--accent-deep); }
  .gvm-btn:disabled{ opacity:.5; cursor:not-allowed; }

  .gvm-btn-outline{
    position:relative;
    background:transparent; color:var(--accent); border:1px solid var(--accent-soft);
    padding:6px 13px; border-radius:3px; font-size:12px; cursor:pointer;
    white-space:nowrap;
  }
  .gvm-btn-outline:hover:not(:disabled){ background:var(--hover-tint); }
  .gvm-btn-outline:disabled{ opacity:.5; cursor:not-allowed; }

  .gvm-status{ font-size:12.5px; color:var(--text-soft); margin-top:12px; min-height:16px; }
  .gvm-status.error{ color:#b5432f; }
  .gvm-hint{ font-size:11.5px; color:var(--text-soft); margin-top:8px; }

  .gvm-btn-feedback{
    position:absolute; left:50%; bottom:calc(100% + 6px); transform:translateX(-50%);
    white-space:nowrap; font-size:11px; font-weight:600; color:#fff; background:var(--accent);
    padding:4px 9px; border-radius:5px; opacity:0; pointer-events:none;
    transition:opacity .15s ease; z-index:5;
  }
  .gvm-btn-feedback.show{ opacity:1; }

  .gvm-scroll-hint{
    position:fixed; left:50%; bottom:20px; transform:translateX(-50%) translateY(0);
    background:var(--accent); color:#fff; font-size:13px; font-weight:600;
    padding:10px 18px; border-radius:999px; box-shadow:0 6px 20px rgba(0,0,0,.25);
    display:none; align-items:center; gap:6px; z-index:20; cursor:pointer; border:none;
    opacity:1; transition:opacity .25s ease, transform .25s ease;
  }
  .gvm-scroll-hint.show{ display:flex; }
  .gvm-scroll-hint.hide{ opacity:0; transform:translateX(-50%) translateY(12px); pointer-events:none; }
  .gvm-scroll-hint .arrow{ display:inline-block; animation:gvm-bounce 1.2s infinite; }
  @keyframes gvm-bounce{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(4px); } }
  @media (min-width:901px){ .gvm-scroll-hint{ display:none !important; } }

  .gvm-intro-head{ display:flex; flex-wrap:wrap; gap:8px; justify-content:space-between; align-items:center; margin-bottom:8px; }
  .gvm-intro-edit{
    width:100%; min-height:130px; padding:10px 12px; border:1px solid var(--field-border); border-radius:4px;
    font-family:"Noto Sans TC",sans-serif; font-size:13.5px; line-height:1.8;
    resize:vertical; background:#fff; color:var(--text);
  }
  .gvm-intro-edit:focus{ outline:none; border-color:var(--accent); }

  .gvm-edit-item{ border:1px solid var(--line); border-radius:4px; padding:12px; background:#fff; }
  .gvm-edit-item + .gvm-edit-item{ margin-top:10px; }
  .gvm-edit-head{ display:flex; flex-wrap:wrap; gap:6px 10px; justify-content:space-between; align-items:center; margin-bottom:6px; }
  .gvm-edit-num{ font-size:11px; color:var(--rose); font-weight:700; }
  .gvm-edit-actions{ display:flex; gap:6px; flex-wrap:wrap; }
  .gvm-btn-mini{ padding:3px 9px; font-size:11px; text-decoration:none; display:inline-block; }
  .gvm-used-badge{
    font-size:10px; font-weight:700; color:#b5432f; background:#fbe7e2;
    padding:2px 7px; border-radius:999px; margin-left:8px; white-space:nowrap;
  }
  .gvm-related-badge{
    font-size:10px; font-weight:700; color:var(--accent-soft); background:var(--badge-bg);
    padding:2px 7px; border-radius:999px; margin-left:8px; white-space:nowrap;
  }
  .gvm-img-hint{ font-size:11px; color:var(--text-soft); margin-top:6px; }
  .gvm-edit-item input, .gvm-edit-item textarea{
    width:100%; padding:7px 9px; border:1px solid var(--line); border-radius:3px;
    font-size:13px; font-family:inherit; margin-top:4px; color:var(--text);
  }
  .gvm-edit-item textarea{ min-height:70px; resize:vertical; line-height:1.6; }
  .gvm-edit-item label{ font-size:10.5px; color:var(--text-soft); }
  .gvm-edit-url{ font-size:11px; color:var(--accent-soft); margin-top:8px; word-break:break-all; }
  .gvm-edit-url a{ color:var(--accent-soft); }

  .gvm-chip-block{ margin-top:12px; }
  .gvm-chip-label{ font-size:11px; color:var(--text-soft); margin-bottom:6px; }
  .gvm-chip-row{ display:flex; flex-wrap:wrap; gap:6px; }
  .gvm-chip{
    background:#fff; color:var(--accent); border:1px solid var(--field-border); border-radius:999px;
    padding:4px 12px; font-size:12px; cursor:pointer; font-family:inherit;
  }
  .gvm-chip:hover{ background:var(--hover-tint); }

  .gvm-adv-toggle{
    background:none; border:none; color:var(--accent); font-size:12.5px; font-weight:700;
    cursor:pointer; padding:6px 0; display:flex; align-items:center; gap:6px;
  }
  .gvm-adv-body{ display:none; margin-top:12px; }
  .gvm-adv-body.open{ display:block; }
  .gvm-adv-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  @media (max-width:520px){ .gvm-adv-grid{ grid-template-columns:1fr; } }

  .gvm-copy-row{ margin-top:14px; display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  .gvm-copy-hint{ font-size:11.5px; color:var(--text-soft); }

  .gvm-preview-wrap{ position:sticky; top:20px; }
  @media (max-width:900px){ .gvm-preview-wrap{ position:static; } }
  .gvm-preview-frame{ background:var(--paper); border:1px solid var(--line); border-radius:6px; overflow:hidden; }
  .gvm-preview-bar{
    background:#fff; border-bottom:1px solid var(--line); padding:8px 14px;
    font-size:11px; color:var(--text-soft); letter-spacing:.1em;
  }
  .gvm-preview-body{ padding:30px 28px 40px; min-height:300px; }
  .gvm-pv-empty{ text-align:center; color:var(--text-soft); font-size:13px; padding:60px 20px; line-height:2; }

  .gvm-pv-masthead{ text-align:center; margin-bottom:26px; }
  .gvm-pv-eyebrow{ font-size:10px; letter-spacing:.3em; color:var(--rose); text-transform:uppercase; font-weight:700; margin-bottom:6px; }
  .gvm-pv-title{ font-family:"Noto Serif TC",serif; font-weight:900; font-size:22px; color:var(--accent-deep); margin:0 0 6px; }
  .gvm-pv-sub{ font-size:11.5px; color:var(--text-soft); }
  .gvm-pv-date{ font-size:11px; color:var(--accent-soft); font-weight:700; letter-spacing:.05em; margin-top:8px; }
  .gvm-pv-rule{ width:40px; height:2px; background:var(--rose); margin:14px auto 0; }

  .gvm-pv-section-divider{ display:flex; align-items:center; gap:12px; margin:32px 0 22px; }
  .gvm-pv-section-divider::before, .gvm-pv-section-divider::after{ content:''; flex:1; height:1px; background:var(--line); }
  .gvm-pv-section-divider span{ font-size:10px; letter-spacing:.25em; color:var(--rose); text-transform:uppercase; font-weight:700; white-space:nowrap; }

  .gvm-pv-intro-wrap{ margin:0 0 22px; }
  .gvm-pv-intro{
    font-family:"Noto Serif TC",serif; font-size:15.5px; font-weight:600; line-height:1.85; color:var(--text);
    border-left:3px solid var(--rose-light); padding:6px 0 6px 16px; white-space:pre-wrap;
  }

  .gvm-pv-item{ display:flex; gap:16px; padding:20px 0; }
  .gvm-pv-item + .gvm-pv-item{ border-top:1px solid var(--line); }
  .gvm-pv-media{ display:flex; flex-direction:column; align-items:flex-start; gap:8px; flex-shrink:0; width:76px; }
  .gvm-pv-num{ font-family:"Noto Serif TC",serif; font-weight:700; font-size:28px; color:var(--rose); line-height:1; text-align:left; }
  .gvm-pv-thumb{ width:76px; height:76px; border-radius:6px; object-fit:cover; background:var(--panel-bg); }
  .gvm-pv-body{ flex:1; min-width:0; }
  .gvm-pv-source{ font-size:10.5px; color:var(--accent-soft); font-weight:700; letter-spacing:.04em; margin-bottom:5px; }
  .gvm-pv-item-title{ font-family:"Noto Serif TC",serif; font-size:15px; font-weight:700; color:var(--accent-deep); margin:0 0 6px; line-height:1.5; }
  .gvm-pv-summary{ font-size:12.5px; line-height:1.7; color:var(--text); margin-bottom:8px; }
  .gvm-pv-link{ font-size:11.5px; color:var(--accent); text-decoration:none; font-weight:700; border-bottom:1px solid var(--accent-soft); padding-bottom:1px; }
  .gvm-pv-link:hover{ color:var(--rose); border-color:var(--rose); }

  .gvm-footnote{ text-align:center; font-size:11px; color:var(--text-soft); margin-top:30px; padding-top:18px; border-top:1px solid var(--line); line-height:1.7; }

  .gvm-focus-label{ font-size:11px; letter-spacing:.1em; color:var(--accent-soft); text-transform:uppercase; font-weight:700; margin-bottom:8px; }
  .gvm-focus-text{ font-size:13px; line-height:1.8; color:var(--text); }
  .gvm-focus-source{ font-size:11px; color:var(--text-soft); margin-top:8px; }
  .gvm-focus-source a{ color:var(--accent-soft); }

  .gvm-pv-focus{ margin:0 0 22px; }
  .gvm-pv-focus-label{ font-size:11px; letter-spacing:.15em; color:var(--accent-soft); text-transform:uppercase; font-weight:700; margin-bottom:8px; }
  .gvm-pv-focus-text{ font-family:"Noto Serif TC",serif; font-size:15px; font-weight:600; line-height:1.85; color:var(--text); }
  .gvm-pv-focus-source{ font-size:11px; color:var(--text-soft); margin-top:10px; }
  .gvm-pv-focus-source a{ color:var(--accent-soft); text-decoration:none; }
  .gvm-pv-focus-source a:hover{ color:var(--rose); }

  @media (max-width:900px){
    .gvm-pv-item{ flex-direction:column; }
    .gvm-pv-media{ width:100%; }
    .gvm-pv-thumb{ width:100%; height:auto; object-fit:unset; border-radius:8px; }
    .gvm-pv-num{ font-size:30px; }

    .gvm-pv-intro{ border-left:none; padding-left:0; }
  }
</style>
</head>
<body>
<div class="topbar"></div>
<div class="page-header">
  <a class="back-link" href="../index.html">← 回入口頁</a>
  <span class="brand">BRUNO SMART AI LTD.</span>
</div>

<div id="gvm-root">
  <div class="gvm-masthead">
    <div class="gvm-masthead-eyebrow">GVM INTELLIGENT CURATION</div>
    <div class="gvm-masthead-title">遠見智能策展部</div>
    <div class="gvm-masthead-sub">選擇要策展的資料庫，開始搜尋真實文章、生成推播內容</div>
    <div class="gvm-source-switcher">
      <button type="button" class="gvm-source-btn" id="gvm-source-gvm" data-source="gvm">
        <span class="dot"></span>遠見線上讀
      </button>
      <button type="button" class="gvm-source-btn" id="gvm-source-esg" data-source="esg">
        <span class="dot"></span>ESG遠見共好圈
      </button>
    </div>
    <div class="gvm-source-caption" id="gvm-source-caption"></div>
  </div>

  <div class="gvm-draft-banner" id="gvm-draft-banner">
    <span class="grow" id="gvm-draft-text"></span>
    <button type="button" class="gvm-draft-btn primary" id="gvm-draft-restore">繼續上次的編輯</button>
    <button type="button" class="gvm-draft-btn" id="gvm-draft-discard">重新開始</button>
  </div>

  <div class="gvm-layout">
    <!-- LEFT: editing workspace -->
    <div>
      <div class="gvm-panel">
        <div class="gvm-panel-label">1・搜尋設定</div>
        <div class="gvm-form">
          <div class="gvm-field gvm-keyword-field">
            <label for="gvm-keyword">關鍵字</label>
            <input id="gvm-keyword" type="text" placeholder="例如：AI、淨零、高齡化" autocomplete="off">
          </div>
          <div class="gvm-field">
            <label for="gvm-year">限西元幾年之後</label>
            <select id="gvm-year"></select>
          </div>
          <div class="gvm-field">
            <label for="gvm-count">文章篇數</label>
            <select id="gvm-count">
              <option value="3">3 篇</option>
              <option value="4" selected>4 篇</option>
              <option value="5">5 篇</option>
            </select>
          </div>
          <button id="gvm-generate" class="gvm-btn" disabled>搜尋</button>
          <button id="gvm-reset" class="gvm-btn-outline" style="align-self:flex-end">清除∕重新開始</button>
        </div>
        <div id="gvm-last-keyword" class="gvm-copy-hint" style="margin-top:8px"></div>
        <div id="gvm-status" class="gvm-status">資料庫載入中…</div>
        <div id="gvm-hot-keywords" class="gvm-chip-block" style="display:none">
          <div class="gvm-chip-label">🔥 熱門關鍵字（近半年館藏高頻主題）</div>
          <div id="gvm-hot-keywords-list" class="gvm-chip-row"></div>
        </div>
        <div id="gvm-recent-keywords" class="gvm-chip-block" style="display:none">
          <div class="gvm-chip-label">🕘 最近用過</div>
          <div id="gvm-recent-keywords-list" class="gvm-chip-row"></div>
        </div>
      </div>

      <div id="gvm-intro-panel" class="gvm-panel" style="display:none">
        <div class="gvm-intro-head">
          <div class="gvm-panel-label" style="margin:0">2・編者的話</div>
          <div style="display:flex; gap:8px;">
            <button id="gvm-regen-intro" class="gvm-btn-outline">換一版</button>
            <button id="gvm-polish-intro" class="gvm-btn-outline">複製潤稿提示詞</button>
          </div>
        </div>
        <textarea id="gvm-intro-edit" class="gvm-intro-edit"></textarea>
        <div id="gvm-intro-count" class="gvm-copy-hint" style="margin-top:6px;text-align:right"></div>
      </div>

      <div id="gvm-list-panel" class="gvm-panel" style="display:none">
        <div class="gvm-panel-label">3・文章內容（可編輯）</div>
        <div id="gvm-edit-list"></div>
      </div>

      <div class="gvm-panel">
        <div class="gvm-intro-head">
          <div class="gvm-panel-label" style="margin:0" id="gvm-focus-panel-label">4・國際焦點（自動帶入，真實報導）</div>
          <div style="display:flex; gap:8px;">
            <select id="gvm-focus-year"></select>
            <button id="gvm-focus-cycle" class="gvm-btn-outline">換一篇</button>
          </div>
        </div>
        <div id="gvm-focus-list"></div>
      </div>

      <div id="gvm-utm-panel" class="gvm-panel" style="display:none">
        <button id="gvm-line-toggle" class="gvm-adv-toggle">▸ LINE 推播文字・開頭與結尾文案</button>
        <div id="gvm-line-body" class="gvm-adv-body">
          <div class="gvm-field">
            <label for="gvm-line-date">推播日期（文案裡的日期變數依這天代入）</label>
            <input id="gvm-line-date" type="date">
          </div>
          <div id="gvm-line-vars" class="gvm-copy-hint" style="margin:6px 0 12px"></div>
          <div class="gvm-field">
            <label for="gvm-line-header">開頭文案（排在文章清單之前）</label>
            <textarea id="gvm-line-header" class="gvm-intro-edit" style="min-height:170px"></textarea>
          </div>

<script>
  var $ = function (id) { return document.getElementById(id); };

  // 資料庫切換：兩組來源共用同一套搜尋/比對/介面邏輯，差異只在資料檔案位置、
  // 「國際焦點」對應的分類、關鍵字輸入框的提示文字。切換來源時重載 ARTICLES、
  // 清掉全文快取、重算熱門關鍵字與國際焦點，不用重新整理頁面。
  var DATA_SOURCES = {
    gvm: {
      label: '遠見線上讀', dataUrl: 'data/curation_index.json', summariesDir: 'data/summaries/',

      previewEyebrow: 'GVM WEEKLY CURATION', previewSub: '每週智能策展・僅收錄遠見雜誌紙本典藏文章', domain: 'gvm.com.tw',
      useUtm: true, utmCampaign: 'gvm_curation',
      exportPalette: {
        accent: '#16325c', deep: '#0d2038', soft: '#4a6483',
        decor: '#a9746e', decorLight: '#d9b8a9', line: '#dde3ea', thumbBg: '#eef1f5'

    },
    esg: {

      focusCategory: '全球趨勢', keywordPlaceholder: '例如：淨零、碳權、循環經濟',
      previewEyebrow: 'ESG DAILY CURATION', previewSub: '每日智能策展・僅收錄ESG遠見共好圈真實報導', domain: 'esg.gvm.com.tw',
      // ESG 共好圈的推播是分享給團隊看的，不是對外行銷檔期，沒有回頭看成效報表的需求，
      // 所以整個模式不掛 UTM：面板隱藏、所有輸出（複製連結／下載 HTML／LINE 文字）都是乾淨網址。
      // V2.0 曾為這裡準備 utmCampaign: 'esg_curation'，確認用不到後移除，不留沒人用的死設定。
      useUtm: false,
      exportPalette: {
        accent: '#00a153', deep: '#00733b', soft: '#4a8a6a',
        decor: '#00a153', decorLight: '#b3e6cc', line: '#d6f0e2', thumbBg: '#eafaf1'
      }
    }
  };
  var currentSource = 'gvm';
  function sourceConfig() { return DATA_SOURCES[currentSource]; }

  var ARTICLES = [];

  // 這個資料庫實際涵蓋的年份區間，每次載入後由真實文章算出來，不寫死。
  // 排序的新鮮度加分、年份選單、畫面上的說明文字全部共用這一組值——
  // V2.0 只把年份選單改成動態，另外兩處還留著 1987–2026，資料一長就會互相矛盾。
  var dataYearRange = { min: 0, max: 0, label: '' };

  function computeYearRange() {
    var min = 0, max = 0;
    for (var i = 0; i < ARTICLES.length; i++) {
      var y = yearOf(ARTICLES[i]);
      if (!y) continue;
      if (!min || y < min) min = y;
      if (y > max) max = y;
    }
    dataYearRange.min = min;
    dataYearRange.max = max;
    dataYearRange.label = min ? (min + '–' + max) : '';
  }

  var state = { keyword: '', intro: '', articles: [], yearLimit: 0 };
  var hotKeywordsBlock = $('gvm-hot-keywords');
  var hotKeywordsList = $('gvm-hot-keywords-list');
  var recentKeywordsBlock = $('gvm-recent-keywords');
  var recentKeywordsList = $('gvm-recent-keywords-list');
  var globalFocusCandidates = [];
  var globalFocusArticle = null;
  var focusYearSelect = $('gvm-focus-year');
  var sourceGvmBtn = $('gvm-source-gvm');
  var sourceEsgBtn = $('gvm-source-esg');
  var sourceCaptionEl = $('gvm-source-caption');
  var focusPanelLabelEl = $('gvm-focus-panel-label');

  // 同義詞擴充表：key 為代表詞，陣列為同組所有詞。要擴充涵蓋主題直接在這裡加陣列即可。
  // 兩個資料庫各有一份：雜誌本誌涵蓋各行各業，ESG 共好圈則集中在永續議題，
  // 詞彙密度差很多（例如「碳權/碳費/碳交易」在本誌很少見、在 ESG 是主力題目）。
  var SYNONYM_GROUPS_GVM = [
    ['AI','人工智慧','智能','生成式AI','ChatGPT'],
    ['淨零','碳中和','減碳','溫室氣體','淨零排放'],
    ['ESG','永續','企業永續','永續發展'],
    ['高齡化','高齡','老年','銀髮','超高齡社會'],
    ['少子化','少子','生育率','人口危機'],
    ['房市','房地產','房價','買房','不動產'],
    ['半導體','晶片','台積電','晶圓'],
    ['通膨','物價','升息','央行'],
    ['數位轉型','數位化','轉型'],
    ['職場','工作','就業','人才'],
    ['教育','學校','大學','108課綱'],
    ['兩岸','中國大陸','中國','對岸'],
    ['選舉','大選','總統大選','政治'],
    ['健康','醫療','醫院','疾病','長照'],
    ['旅遊','觀光','出國','景點'],
    ['新創','創業','新創公司','獨角獸'],
    ['資安','駭客','網路安全','個資外洩'],
    ['電動車','EV','特斯拉','充電'],
    ['缺工','人力短缺','勞動力'],
    ['零售','通路','電商','超商'],
    ['品牌','行銷','廣告','品牌經營'],
    ['領導','管理','經營','企業管理'],
    ['理財','財富管理','投資','退休金'],
    ['美國','川普','拜登','美中'],
    ['日本','東京','日圓'],
    ['疫情','新冠','COVID'],
    ['氣候變遷','極端氣候','暖化'],
    ['綠能','再生能源','太陽能','風電']
  ];

  // ESG 共好圈專用。每一組的詞都先對 4,289 篇真實文章實測過出現次數，
  // 幾乎查不到的詞（例如「洗綠」只有 1 篇、「綠色債券」3 篇）就不放進來，
  // 避免產生點了搜不到東西的熱門關鍵字。
  var SYNONYM_GROUPS_ESG = [
    ['淨零','碳中和','減碳','淨零排放','淨零轉型','溫室氣體','碳排'],
    ['碳權','碳費','碳交易','碳定價','碳稅','碳盤查','碳足跡','碳關稅','CBAM'],
    ['ESG','永續','企業社會責任','CSR','永續報告書','SDGs'],
    ['氣候變遷','氣候','極端氣候','暖化','COP'],
    ['再生能源','綠電','太陽能','風電','光電','儲能','氫能','地熱','能源轉型'],
    ['循環經濟','回收','再生','廢棄物','塑膠','資源循環'],
    ['生物多樣性','生態','海洋','森林','水資源'],
    ['供應鏈','綠色供應鏈','採購'],
    ['公司治理','資訊揭露','漂綠'],
    ['永續金融','綠色金融','影響力投資'],
    ['AI','人工智慧','數位轉型'],
    ['電動車','EV','交通'],
    ['永續城市','城市','綠建築'],
    ['人才','教育'],
    ['社會企業','偏鄉','弱勢','DEI','多元共融'],
    ['健康','醫療','高齡'],
    ['農業','食物'],
    ['核能']
  ];

  function synonymGroups() {
    return currentSource === 'esg' ? SYNONYM_GROUPS_ESG : SYNONYM_GROUPS_GVM;
  }

  function formatYearRange(minY, maxY) {
    if (!minY || !maxY) return '';
    return minY === maxY ? (minY + ' 年') : (minY + '～' + maxY + ' 年');
  }

  // 引言客製化用的小工具：從真實文章資料抽出可以直接引用的具體內容，
  // 不是罐頭句套關鍵字——分類、標題、摘要片段都來自 state.articles 的真實欄位。
  function introSnippet(text, maxLen) {
    maxLen = maxLen || 32;
    var s = (text || '').trim();
    if (s.length <= maxLen) return s;
    var cut = s.slice(0, maxLen);
    // 盡量在完整的句子邊界斷開，避免剛好切在原文的引號或詞中間；優先找句尾標點（。！？），
    // 逗號/頓號斷句只當作退而求其次的選項，不然常常會切出「...、」這種半句
    var strongPunct = Math.max(cut.lastIndexOf('。'), cut.lastIndexOf('！'), cut.lastIndexOf('？'));
    if (strongPunct >= maxLen * 0.5) return cut.slice(0, strongPunct + 1);
    var softPunct = Math.max(cut.lastIndexOf('，'), cut.lastIndexOf('、'));
    if (softPunct >= maxLen * 0.5) return cut.slice(0, softPunct + 1);
    return cut + '…';
  }

  // 引言範本把摘要片段包進「」引號時，如果片段本身已經是完整句子（結尾有標點），
  // 就不要在引號外再補一個句號，避免變成「...。」。這種重複標點
  function quoteEnding(snippet) {
    return /[。！？…，、]$/.test(snippet) ? snippet : (snippet + '。');
  }

  function uniqueCategories(articles) {
    var seen = {}, list = [];
    articles.forEach(function (a) { if (a.s && !seen[a.s]) { seen[a.s] = true; list.push(a.s); } });
    return list;
  }

  // 資料庫裡的分類欄位（s）是給系統比對用的標籤，直接印給讀者看會像報表。
  // 這裡固定翻成一組自然語言說法——只翻譯既有的 16 種真實分類，不是編造內容；
  // 遇到不在表列中的分類（理論上不會有，但保留保底）就照原文顯示。
  var CATEGORY_PHRASES = {
    '封面故事': '深度議題', '特別企畫': '專題企劃', '名家專欄': '名家觀點', '人文生活': '人文生活視角',
    '時事熱線': '時事脈動', '產業綜合': '產業動態', '財經綜合': '財經趨勢', '全球焦點': '國際視野',
    '兩岸新世紀': '兩岸情勢', '遠見調查': '第一手調查', '精采人物': '第一線人物故事', '編者的話': '編輯視角',
    '台灣新希望': '台灣在地故事', '永續新主張': '永續倡議', '前瞻科技業': '前瞻科技', '文教新語': '文教觀察'
  };
  function categoryPhrase(cat) { return CATEGORY_PHRASES[cat] || cat; }

  function formatCategoryList(categories) {
    var phrases = categories.map(categoryPhrase);
    if (!phrases.length) return '不同角度';
    if (phrases.length === 1) return phrases[0];
    if (phrases.length === 2) return phrases[0] + '與' + phrases[1];
    return phrases.slice(0, -1).join('、') + '、' + phrases[phrases.length - 1];
  }

  // 文章自己的年月（來自 a.y，如 "2025/08"）轉成「2025年08月」，給引言裡引用時用，
  // 跟卡片上顯示的期別格式一致。
  function formatArticleDate(y) {
    var parts = (y || '').split('/');
    return parts[0] ? (parts[0] + '年' + (parts[1] ? parts[1] + '月' : '')) : '';
  }

  function introSignature() { return '\n\n——' + sourceConfig().label + '智能編輯'; }

  // 一般情境（精準命中且篇數 ≥ 2）用的輪替範本：以「智能編輯」第一人稱、對你直接說話，
  // 開頭帶入今天的真實日期，並直接引用其中一篇（依日期排序最新的精準命中）的真實標題、
  // 摘要片段與真實分類分佈，確保不同關鍵字、不同文章組合產生的引言真的不一樣。
  var INTRO_TEMPLATES = [
    function (kw, count, yearRange, categoryText, hook) {
      return '你最近過得好嗎？這次想跟你聊聊「' + kw + '」——翻找' + sourceConfig().label + '的檔案庫時，最先跳出來的是 ' +
        formatArticleDate(hook.y) + ' 的一篇報導，裡頭寫著：「' + quoteEnding(introSnippet(hook.summary, 40)) + '」' +
        '我另外挑了 ' + (count - 1) + ' 篇，從' + categoryText + '都有，希望能陪你把「' + kw + '」這件事看得更立體一些。' + introSignature();
    },
    function (kw, count, yearRange, categoryText, hook) {
      return '又到了整理「' + kw + '」的時候。這次翻遍典藏，最讓我停下來的是 ' + formatArticleDate(hook.y) +
        ' 那篇——裡面提到：「' + quoteEnding(introSnippet(hook.summary, 40)) + '」加上另外 ' + (count - 1) + ' 篇，橫跨' +
        categoryText + '，希望這幾篇報導能幫你把「' + kw + '」的脈絡串起來。' + introSignature();
    },
    function (kw, count, yearRange, categoryText, hook) {
      return '你好。今天想和你分享「' + kw + '」這個題目——' + sourceConfig().label + '在 ' + formatArticleDate(hook.y) +
        ' 寫過：「' + introSnippet(hook.summary, 40) + '」，這句話我印象很深。這次一共挑了 ' + count + ' 篇，涵蓋' +
        categoryText + '，希望能陪你多看懂「' + kw + '」一點。' + introSignature();
    }
  ];

  // 精準命中恰好 1 篇時：不裝作有「不同時期、不同角度」，如實告知只有 1 篇，直接引用這篇
  function buildSingleIntro(kw, yearRange, hook) {
    return '你最近過得好嗎？這次想跟你聊聊「' + kw + '」——不過老實說，' + sourceConfig().label + '典藏裡直接相關的真實報導只有 1 篇（' +
      formatArticleDate(hook.y) + '）：「' + quoteEnding(introSnippet(hook.summary, 50)) + '」篇數不多，但這確實是遠見對「' + kw +
      '」的第一手記錄，還是想讓你看看。' + introSignature();
  }

  // 精準命中篇數不足、補了同分類延伸閱讀時：把組成講清楚，並引用精準命中那篇的真實標題，
  // 不要讓讀者以為全部都是精準命中
  function buildFallbackIntro(kw, exactArticles, exactYearRange, relatedCount, category) {
    var hook = exactArticles[0];
    var exactPart = exactArticles.length === 1
      ? ('1 篇（' + formatArticleDate(hook.y) + '）：「' + introSnippet(hook.summary, 40) + '」')
      : (exactArticles.length + ' 篇（' + exactYearRange + '），包含〈' + hook.title + '〉等');
    return '你最近過得好嗎？這次想跟你聊聊「' + kw + '」——翻找檔案庫後，直接相關的真實報導找到 ' + exactPart +
      '，篇數還沒到你設定的數量，所以我另外從「' + categoryPhrase(category) + '」這個類別裡，挑了 ' + relatedCount +
      ' 篇比較新的報導補上，內容同樣真實，但嚴格來說不是「' + kw + '」的直接報導，下方文章清單已經幫你標示出來，用之前留意一下。' + introSignature();
  }
  var introTemplateIdx = 0;

  function expandTerms(keyword) {
    var kw = keyword.trim();
    if (!kw) return [];
    var lower = kw.toLowerCase();
    var groups = synonymGroups();
    for (var i = 0; i < groups.length; i++) {
      var group = groups[i];
      var hit = group.some(function (term) {
        var t = term.toLowerCase();
        return t === lower || t.includes(lower) || lower.includes(t);
      });
      if (hit) return Array.from(new Set([kw].concat(group)));
    }
    return [kw];
  }

  function cleanExcerpt(str) {
    if (!str) return str;
    return str
      .replace(/&(nbsp|amp|lt|gt|quot|#39);/g, ' ')
      .replace(/&[a-zA-Z]{0,5}$/, '')
      .trim();
  }

  // 全文摘要按年份拆檔存放（smart-curation/data/summaries/{year}.json），
  // 精簡索引檔只帶短摘要片段（es）供搜尋比對，避免每次都要下載全部 29,583 篇的全文。
  // 只在文章真的被選中要顯示時，才動態抓對應年份的全文檔。
  var summariesCache = {};

  function ensureSummaries(years) {
    var toFetch = years.filter(function (y) { return y && !summariesCache[y]; });
    return Promise.all(toFetch.map(function (y) {
      return fetch(sourceConfig().summariesDir + y + '.json')
        .then(function (r) { return r.ok ? r.json() : {}; })
        .then(function (map) { summariesCache[y] = map; })
        .catch(function () { summariesCache[y] = {}; });
    }));
  }

  function fullTextFor(article) {
    var year = (article.y || '').split('/')[0];
    var map = summariesCache[year];
    if (map && map[article.i]) return map[article.i];
    return (article.es || '') + '…';
  }

  function scoreArticle(article, terms, originalLower) {
    var title = (article.t || '').toLowerCase();
    var excerpt = (article.es || '').toLowerCase();
    var score = 0;
    terms.forEach(function (term) {
      var t = term.toLowerCase();
      var isOriginal = t === originalLower;
      if (title.includes(t)) score += isOriginal ? 10 : 7;
      if (excerpt.includes(t)) score += isOriginal ? 5 : 3;
    });
    // 新鮮度加分依這個資料庫實際的年份區間正規化，不寫死 1987–2026：ESG 共好圈從 2005 年起，
    // 套本誌的區間會把新舊差距壓縮掉（最舊的一篇也先拿到將近一半的加分）；寫死上限 2026 更麻煩——
    // 每月自動爬進來的新文章一旦超過 2026，就會全部被夾在滿分，新鮮度等於失去鑑別力。
    if (score > 0) {
      var year = parseInt((article.y || '').split('/')[0], 10);
      var span = dataYearRange.max - dataYearRange.min;
      if (!isNaN(year) && span > 0) {
        var recency = Math.max(0, Math.min(1, (year - dataYearRange.min) / span));
        score += recency * 3;
      }
    }
    return score;
  }

  function yearOf(article) {
    return parseInt((article.y || '').split('/')[0], 10) || 0;
  }
  function monthOf(article) {
    return parseInt((article.y || '').split('/')[1], 10) || 0;
  }

  // 找不到足夠篇數時的延伸閱讀類別：從已精準命中的文章裡票選最多人所屬的分類（s 欄位，
  // 例如「財經綜合」「國際」），不是憑空亂配。同一分類底下取最新的真實文章補滿篇數，
  // 不虛構、不硬塞不相關內容——只是誠實標示「這篇不是精準命中，是同分類延伸閱讀」。
  function pickRelatedArticles(exactPicked, pool, needed, excludeIds) {
    if (needed <= 0 || !exactPicked.length) return [];
    var categoryVotes = {};
    exactPicked.forEach(function (a) { if (a.s) categoryVotes[a.s] = (categoryVotes[a.s] || 0) + 1; });
    var topCategory = Object.keys(categoryVotes).sort(function (x, y) { return categoryVotes[y] - categoryVotes[x]; })[0];
    if (!topCategory) return [];
    return pool
      .filter(function (a) { return a.s === topCategory && !excludeIds[a.i]; })
      .sort(function (a, b) {
        var ya = yearOf(a), yb = yearOf(b);
        if (ya !== yb) return yb - ya;
        return monthOf(b) - monthOf(a);
      })
      .slice(0, needed);
  }

  function searchArticles(keyword, count, yearLimit) {
    var terms = expandTerms(keyword);
    if (!terms.length) return { picked: [], exactCount: 0 };
    var originalLower = keyword.trim().toLowerCase();

    var pool = ARTICLES;
    if (yearLimit) pool = pool.filter(function (a) { return yearOf(a) >= yearLimit; });

    var scored = pool
      .map(function (a) { return { article: a, score: scoreArticle(a, terms, originalLower) }; })
      .filter(function (x) { return x.score > 0; })
      .sort(function (a, b) { return b.score - a.score; });

    var picked = [];
    var usedIssues = {};
    scored.forEach(function (item) {
      if (picked.length >= count) return;
      // 一期一篇：本誌是月刊，同一期挑兩篇會讓整份策展看起來偏食。但 ESG 共好圈是網路媒體、
      // 沒有期數（n 欄位實測 4,289 篇全為空字串），原本 `n || y` 會讓條件掉成「同一個月最多一篇」——
      // 對幾乎每天發文的資料庫來說是無謂的限制，會硬擠掉分數更高的文章。沒有期數就不套用這條。
      var issueKey = item.article.n;
      if (issueKey) {
        if (usedIssues[issueKey]) return;
        usedIssues[issueKey] = true;
      }
      picked.push(item.article);
    });
    if (picked.length < count) {
      scored.forEach(function (item) {
        if (picked.length >= count) return;
        if (picked.indexOf(item.article) !== -1) return;
        picked.push(item.article);
      });
    }

    var exactIds = {};
    picked.forEach(function (a) { exactIds[a.i] = true; });
    if (picked.length > 0 && picked.length < count) {
      var related = pickRelatedArticles(picked, pool, count - picked.length, exactIds);
      picked = picked.concat(related);
    }

    picked = picked.slice().sort(function (a, b) {
      var ya = yearOf(a), yb = yearOf(b);
      if (ya !== yb) return yb - ya;
      return monthOf(b) - monthOf(a);
    });
    return { picked: picked, exactIds: exactIds };
  }

  function buildIntro(keyword, articles) {
    var exactArticles = articles.filter(function (a) { return a.matched; });
    var relatedArticles = articles.filter(function (a) { return !a.matched; });
    var exactYears = exactArticles.map(yearOf).filter(function (y) { return y > 0; });
    var exactMinY = exactYears.length ? Math.min.apply(null, exactYears) : '';
    var exactMaxY = exactYears.length ? Math.max.apply(null, exactYears) : '';
    var exactYearRange = formatYearRange(exactMinY, exactMaxY);

    if (relatedArticles.length > 0) {
      var category = relatedArticles[0].s || '相關主題';
      return buildFallbackIntro(keyword, exactArticles, exactYearRange, relatedArticles.length, category);
    }
    if (exactArticles.length === 1) {
      return buildSingleIntro(keyword, exactYearRange, exactArticles[0]);
    }
    var categoryText = formatCategoryList(uniqueCategories(exactArticles));
    var hook = exactArticles[0];
    var tpl = INTRO_TEMPLATES[introTemplateIdx % INTRO_TEMPLATES.length];
    introTemplateIdx++;
    return tpl(keyword, exactArticles.length, exactYearRange, categoryText, hook);
  }

  // 年份選單依「實際載入的資料」產生，不寫死年份範圍：ESG 共好圈最早只到 2005 年，
  // 如果沿用雜誌本誌的 1987 起算，會列出十幾個永遠選不到東西的年份，讓人誤以為有那麼久的典藏。
  function populateYears() {
    var minY = dataYearRange.min || 1987;
    var maxY = dataYearRange.max || new Date().getFullYear();
    var previous = yearSelect.value;
    yearSelect.innerHTML = '';
    var opt0 = document.createElement('option');
    opt0.value = ''; opt0.textContent = '不限年份';
    yearSelect.appendChild(opt0);
    for (var y = maxY; y >= minY; y--) {
      var opt = document.createElement('option');
      opt.value = String(y);
      opt.textContent = y + ' 年之後';
      yearSelect.appendChild(opt);
    }
    // 換資料庫後若原本選的年份在新資料庫也存在就保留，否則回到「不限年份」
    yearSelect.value = (previous && previous >= minY && previous <= maxY) ? previous : '';
  }

  (function setDefaultDate() {
    var d = new Date();
    var mm = String(d.getMonth() + 1).padStart(2, '0');
    var dd = String(d.getDate()).padStart(2, '0');
    utmDateInput.value = d.getFullYear() + '-' + mm + '-' + dd;
  })();

  function mmddFromDateValue(v) {
    if (!v) return '';
    var parts = v.split('-');
    return parts.length === 3 ? parts[1] + parts[2] : '';
  }

  function appendUtm(rawUrl) {
    if (!sourceConfig().useUtm) return rawUrl;
    var mmdd = mmddFromDateValue(utmDateInput.value);
    var campaign = utmCampaignInput.value.trim();
    var content = mmdd ? campaign + '_' + mmdd : campaign;
    var params = 'utm_source=' + encodeURIComponent(utmSourceInput.value.trim()) +
      '&utm_medium=' + encodeURIComponent(utmMediumInput.value.trim()) +
      '&utm_campaign=' + encodeURIComponent(campaign) +
      '&utm_content=' + encodeURIComponent(content) +
      '&from=' + encodeURIComponent(utmFromInput.value.trim());
    var joiner = rawUrl.indexOf('?') !== -1 ? '&' : '?';
    return rawUrl + joiner + params;
  }

  function formatToday(sep) {
    var d = new Date();
    var mm = String(d.getMonth() + 1).padStart(2, '0');
    var dd = String(d.getDate()).padStart(2, '0');
    return sep ? [d.getFullYear(), mm, dd].join(sep) : d.getFullYear() + '年' + mm + '月' + dd + '日';
  }

  function setStatus(msg, isError) {
    statusEl.textContent = msg || '';
    statusEl.className = isError ? 'gvm-status error' : 'gvm-status';
  }

  function formatSource(a) {
    var parts = (a.y || '').split('/');
    var y = parts[0] || '', m = parts[1] || '';
    var yStr = y ? y + '年' + (m ? m + '月' : '') : '';
    return [yStr, a.n].filter(Boolean).join('・');
  }

  function escapeHtml(s) {
    return String(s || '').replace(/[&<>]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]; });
  }

  function imgExtOf(url) {
    var m = /\.(jpe?g|png|webp|gif)(?:[?#]|$)/i.exec(url || '');
    return m ? '.' + m[1].toLowerCase() : '.jpg';
  }

  function loadJSON(key, fallback) {
    try {
      var v = JSON.parse(localStorage.getItem(key));
      return v || fallback;
    } catch (e) { return fallback; }
  }
  function saveJSON(key, val) {
    try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {}
  }

  // 「近期用過」提醒：避免同仁在同一輪流行週期（抓兩週）內不小心重複推同一篇文章
  var USED_HISTORY_KEY = 'gvm_used_articles_v1';
  var USED_HISTORY_MAX = 300;
  var DUP_REMINDER_DAYS = 14;

  function recordUsedArticles(articleIds) {
    // GVM 和 ESG 的文章 id 是各自獨立編號，同一組數字可能剛好撞號到兩邊，
    // 存之前一律加上來源前綴，避免「近期用過」提醒跨資料庫誤判成同一篇。
    var history = loadJSON(USED_HISTORY_KEY, []);
    var byId = {};
    history.forEach(function (h) { byId[h.i] = h; });
    var today = formatToday('-');
    articleIds.forEach(function (id) { if (id) byId[currentSource + ':' + id] = { i: currentSource + ':' + id, usedAt: today }; });
    var merged = Object.keys(byId).map(function (k) { return byId[k]; });
    merged.sort(function (a, b) { return a.usedAt < b.usedAt ? 1 : -1; });
    if (merged.length > USED_HISTORY_MAX) merged = merged.slice(0, USED_HISTORY_MAX);
    saveJSON(USED_HISTORY_KEY, merged);
  }

  function getRecentUse(articleId) {
    if (!articleId) return null;
    var history = loadJSON(USED_HISTORY_KEY, []);
    var found = history.find(function (h) { return h.i === currentSource + ':' + articleId; });
    if (!found) return null;
    var cutoff = new Date();
    cutoff.setDate(cutoff.getDate() - DUP_REMINDER_DAYS);
    if (new Date(found.usedAt) < cutoff) return null;
    return found.usedAt;
  }

  // 最近搜尋過的關鍵字快選：本機記錄，方便每週重複策展同一批常用主題。
  // 兩個資料庫各記各的——ESG 專用詞（碳權、循環經濟）出現在雜誌本誌的快選清單裡，
  // 點下去只會搜到很差的結果，反之亦然。
  function recentKwKey() { return 'gvm_recent_keywords_v1:' + currentSource; }
  var RECENT_KW_MAX = 8;

  function recordRecentKeyword(kw) {
    var list = loadJSON(recentKwKey(), []).filter(function (k) { return k !== kw; });
    list.unshift(kw);
    if (list.length > RECENT_KW_MAX) list = list.slice(0, RECENT_KW_MAX);
    saveJSON(recentKwKey(), list);
    renderRecentKeywords();
  }

  function renderRecentKeywords() {
    var list = loadJSON(recentKwKey(), []);
    if (!list.length) { recentKeywordsBlock.style.display = 'none'; return; }
    recentKeywordsList.innerHTML = '';
    list.forEach(function (kw) {
      var chip = document.createElement('button');
      chip.type = 'button';
      chip.className = 'gvm-chip';
      chip.textContent = kw;
      chip.addEventListener('click', function () {
        keywordInput.value = kw;
        generate();
      });
      recentKeywordsList.appendChild(chip);
    });
    recentKeywordsBlock.style.display = 'block';
  }

  // 本地熱門關鍵字：不呼叫任何外部熱搜 API（沒有免費、支援跨網域讀取的公開資料源），
  // 改用館藏近半年文章，統計既有主題同義詞表（SYNONYM_GROUPS）裡哪些主題篇數最多，
  // 保證點下去一定搜得到文章。
  var HOT_KEYWORDS_WINDOW_MONTHS = 6;
  var HOT_KEYWORDS_MIN_COUNT = 3;
  var HOT_KEYWORDS_TOP_N = 6;

  function ymOf(a) { return yearOf(a) * 100 + monthOf(a); }
  function shiftYm(ym, monthsBack) {
    var y = Math.floor(ym / 100), m = ym % 100;
    var total = y * 12 + (m - 1) - monthsBack;
    var ny = Math.floor(total / 12), nm = (total % 12) + 1;
    return ny * 100 + nm;
  }

  function computeHotKeywords() {
    if (!ARTICLES.length) return [];
    var maxYm = 0;
    ARTICLES.forEach(function (a) { var ym = ymOf(a); if (ym > maxYm) maxYm = ym; });
    if (!maxYm) return [];
    var minYm = shiftYm(maxYm, HOT_KEYWORDS_WINDOW_MONTHS);
    var pool = ARTICLES.filter(function (a) { var ym = ymOf(a); return ym >= minYm && ym <= maxYm; });
    var ranked = synonymGroups().map(function (group) {
      var termsLower = group.map(function (t) { return t.toLowerCase(); });
      var count = 0;
      pool.forEach(function (a) {
        var text = ((a.t || '') + ' ' + (a.es || '')).toLowerCase();
        if (termsLower.some(function (t) { return text.indexOf(t) !== -1; })) count++;
      });
      return { term: group[0], count: count };
    });
    ranked.sort(function (a, b) { return b.count - a.count; });
    return ranked.filter(function (r) { return r.count >= HOT_KEYWORDS_MIN_COUNT; }).slice(0, HOT_KEYWORDS_TOP_N);
  }

  function renderHotKeywords() {
    var top = computeHotKeywords();
    if (!top.length) { hotKeywordsBlock.style.display = 'none'; return; }
    hotKeywordsList.innerHTML = '';
    top.forEach(function (item) {
      var chip = document.createElement('button');
      chip.type = 'button';
      chip.className = 'gvm-chip';
      chip.textContent = item.term;
      chip.addEventListener('click', function () {
        keywordInput.value = item.term;
        generate();
      });
      hotKeywordsList.appendChild(chip);
    });
    hotKeywordsBlock.style.display = 'block';
  }

  function swapArticle(index) {
    if (!state.articles[index]) return;
    var terms = expandTerms(state.keyword);
    var originalLower = state.keyword.trim().toLowerCase();
    var pool = ARTICLES;
    if (state.yearLimit) pool = pool.filter(function (a) { return yearOf(a) >= state.yearLimit; });
    var usedIds = {};
    state.articles.forEach(function (a) { usedIds[a.i] = true; });
    var scored = pool
      .map(function (a) { return { article: a, score: scoreArticle(a, terms, originalLower) }; })
      .filter(function (x) { return x.score > 0 && !usedIds[x.article.i]; })
      .sort(function (a, b) { return b.score - a.score; });
    if (!scored.length) {
      setStatus('沒有更多符合「' + state.keyword + '」且尚未使用的文章可更換了。', true);
      return;
    }
    var next = scored[0].article;
    var year = (next.y || '').split('/')[0];
    ensureSummaries([year]).then(function () {
      state.articles[index] = {
        i: next.i, title: next.t, summary: cleanExcerpt(fullTextFor(next)),
        url: next.url, y: next.y, n: next.n, img: next.img || '', s: next.s || '', matched: true
      };
      refreshAll();
      setStatus('已更換第 ' + (index + 1) + ' 篇。');
    });
  }

  function moveArticle(index, direction) {
    var target = index + direction;
    if (target < 0 || target >= state.articles.length) return;
    var tmp = state.articles[index];
    state.articles[index] = state.articles[target];
    state.articles[target] = tmp;
    refreshAll();
  }

  function renderEditList() {
    editListEl.innerHTML = '';
    state.articles.forEach(function (a, i) {
      var item = document.createElement('div');
      item.className = 'gvm-edit-item';

      var head = document.createElement('div');
      head.className = 'gvm-edit-head';

      var numDiv = document.createElement('div');
      numDiv.className = 'gvm-edit-num';
      numDiv.textContent = String(i + 1).padStart(2, '0') + '　' + formatSource(a);
      if (a.matched === false) {
        var relatedBadge = document.createElement('span');
        relatedBadge.className = 'gvm-related-badge';
        relatedBadge.textContent = '延伸閱讀・非精準命中';
        numDiv.appendChild(relatedBadge);
      }
      var recentUse = getRecentUse(a.i);
      if (recentUse) {
        var badge = document.createElement('span');
        badge.className = 'gvm-used-badge';
        badge.textContent = '近期用過・' + recentUse.slice(5).replace('-', '/');
        numDiv.appendChild(badge);
      }
      head.appendChild(numDiv);

      var actions = document.createElement('div');
      actions.className = 'gvm-edit-actions';

      var moveUpBtn = document.createElement('button');
      moveUpBtn.type = 'button';
      moveUpBtn.className = 'gvm-btn-outline gvm-btn-mini';
      moveUpBtn.textContent = '▲';
      moveUpBtn.title = '往上移';
      moveUpBtn.dataset.action = 'move-up';
      moveUpBtn.dataset.i = i;
      if (i === 0) moveUpBtn.disabled = true;
      actions.appendChild(moveUpBtn);

      var moveDownBtn = document.createElement('button');
      moveDownBtn.type = 'button';
      moveDownBtn.className = 'gvm-btn-outline gvm-btn-mini';
      moveDownBtn.textContent = '▼';
      moveDownBtn.title = '往下移';
      moveDownBtn.dataset.action = 'move-down';
      moveDownBtn.dataset.i = i;
      if (i === state.articles.length - 1) moveDownBtn.disabled = true;
      actions.appendChild(moveDownBtn);

      var swapBtn = document.createElement('button');
      swapBtn.type = 'button';
      swapBtn.className = 'gvm-btn-outline gvm-btn-mini';
      swapBtn.textContent = '換一篇';
      swapBtn.dataset.action = 'swap';
      swapBtn.dataset.i = i;
      actions.appendChild(swapBtn);

      var copyLinkBtn = document.createElement('button');
      copyLinkBtn.type = 'button';
      copyLinkBtn.className = 'gvm-btn-outline gvm-btn-mini';
      copyLinkBtn.textContent = '複製連結';
      copyLinkBtn.dataset.action = 'copy-link';
      copyLinkBtn.dataset.i = i;
      actions.appendChild(copyLinkBtn);

      if (a.img) {
        var imgBtn = document.createElement('a');
        imgBtn.className = 'gvm-btn-outline gvm-btn-mini';
        imgBtn.textContent = '開啟原圖';
        imgBtn.href = a.img;
        imgBtn.target = '_blank';
        imgBtn.rel = 'noopener noreferrer';
        imgBtn.download = String(i + 1).padStart(2, '0') + imgExtOf(a.img);
        actions.appendChild(imgBtn);
      }
      head.appendChild(actions);
      item.appendChild(head);

      if (a.img) {
        var imgHint = document.createElement('div');
        imgHint.className = 'gvm-img-hint';
        imgHint.textContent = '圖片會在新分頁開啟，右鍵「另存圖片」時建議命名：' + String(i + 1).padStart(2, '0') + imgExtOf(a.img);
        item.appendChild(imgHint);
      }

      var titleLabel = document.createElement('label');
      titleLabel.textContent = '標題';
      item.appendChild(titleLabel);

      var titleInput = document.createElement('input');
      titleInput.type = 'text';
      titleInput.dataset.field = 'title';
      titleInput.dataset.i = i;
      titleInput.value = a.title;
      item.appendChild(titleInput);

      var summaryRow = document.createElement('div');
      summaryRow.style.cssText = 'margin-top:8px;display:flex;justify-content:space-between;align-items:baseline';
      var summaryLabel = document.createElement('label');
      summaryLabel.textContent = '推薦閱讀文字（來自遠見真實摘要，可微調）';
      var summaryCount = document.createElement('span');
      summaryCount.className = 'gvm-copy-hint';
      summaryCount.dataset.count = i;
      summaryCount.textContent = (a.summary || '').length + ' 字';
      summaryRow.appendChild(summaryLabel);
      summaryRow.appendChild(summaryCount);
      item.appendChild(summaryRow);

      var summaryTextarea = document.createElement('textarea');
      summaryTextarea.dataset.field = 'summary';
      summaryTextarea.dataset.i = i;
      summaryTextarea.value = a.summary;
      item.appendChild(summaryTextarea);

      var urlDiv = document.createElement('div');
      urlDiv.className = 'gvm-edit-url';
      var urlLink = document.createElement('a');
      urlLink.href = a.url; urlLink.target = '_blank'; urlLink.rel = 'noopener noreferrer';
      urlLink.textContent = a.url;
      urlDiv.appendChild(document.createTextNode('原文網址：'));
      urlDiv.appendChild(urlLink);
      item.appendChild(urlDiv);

      editListEl.appendChild(item);
    });
  }

  function renderPreview() {
    if (!state.articles.length) {
      previewBody.innerHTML = '<div class="gvm-pv-empty">輸入關鍵字並按「搜尋」後，這裡會即時顯示最終畫面</div>';
      return;
    }
    var html = '';
    html += '<div class="gvm-pv-masthead">' +
      '<div class="gvm-pv-eyebrow">' + escapeHtml(sourceConfig().previewEyebrow) + '</div>' +
      '<div class="gvm-pv-title">' + escapeHtml(sourceConfig().label) + '</div>' +
      '<div class="gvm-pv-sub">' + escapeHtml(sourceConfig().previewSub) + '</div>' +
      '<div class="gvm-pv-date">' + formatToday() + '</div>' +
      '<div class="gvm-pv-rule"></div></div>';
    html += '<div class="gvm-pv-intro-wrap"><div class="gvm-pv-intro">' + escapeHtml(state.intro) + '</div></div>';
    html += '<div class="gvm-pv-section-divider"><span>編輯推薦</span></div>';
    state.articles.forEach(function (a, i) {
      var thumb = a.img ? '<img class="gvm-pv-thumb" src="' + escapeHtml(a.img) + '" alt="" loading="lazy">' : '';
      html += '<div class="gvm-pv-item">' +
        '<div class="gvm-pv-media"><div class="gvm-pv-num">' + String(i + 1).padStart(2, '0') + '</div>' + thumb + '</div>' +
        '<div class="gvm-pv-body">' +
          '<div class="gvm-pv-source">' + escapeHtml(formatSource(a)) + '</div>' +
          '<div class="gvm-pv-item-title">' + escapeHtml(a.title) + '</div>' +
          '<div class="gvm-pv-summary">' + escapeHtml(a.summary) + '</div>' +
          '<a class="gvm-pv-link" href="' + appendUtm(a.url) + '" target="_blank" rel="noopener">閱讀全文 ➔</a>' +
        '</div></div>';
    });
    if (globalFocusArticle) {
      var fa = globalFocusArticle;
      html += '<div class="gvm-pv-section-divider"><span>國際焦點</span></div>';
      html += '<div class="gvm-pv-focus">' +
        '<div class="gvm-pv-focus-text">' + escapeHtml(fa.t + '。' + cleanExcerpt(fullTextFor(fa))) + '</div>' +
        '<div class="gvm-pv-focus-source">資料來源：《' + escapeHtml(sourceConfig().label) + '》' + escapeHtml(sourceConfig().focusCategory) + '・' + escapeHtml(fa.y || '') + '　' +
        '<a href="' + appendUtm(fa.url) + '" target="_blank" rel="noopener">完整報導 →</a></div></div>';
    }
    // 頁尾這句會跟著下載的 HTML 一起送出去，所以不能寫死「已附加追蹤參數」——
    // ESG 模式不掛 UTM，照舊寫就變成對收件者說了一句不成立的話。
    html += '<div class="gvm-footnote">所有連結均來自' + escapeHtml(sourceConfig().label) + '官網 (' + escapeHtml(sourceConfig().domain) + ') 真實典藏文章' +
      (sourceConfig().useUtm ? '，並自動附加 LINE 成效追蹤參數' : '') + '。</div>';
    previewBody.innerHTML = html;
  }

  function focusYearOf(a) {
    return (a.y || '').split('/')[0];
  }

  function computeGlobalFocus() {
    globalFocusCandidates = ARTICLES
      .filter(function (a) { return a.s === sourceConfig().focusCategory; })
      .sort(function (a, b) { return (b.y || '').localeCompare(a.y || ''); });
    globalFocusArticle = globalFocusCandidates.length ? globalFocusCandidates[0] : null;
    populateFocusYearSelect();
    if (!globalFocusArticle) { renderFocusList(); return; }
    ensureSummaries([focusYearOf(globalFocusArticle)]).then(renderFocusList);
  }

  function populateFocusYearSelect() {
    var years = [];
    globalFocusCandidates.forEach(function (a) {
      var y = focusYearOf(a);
      if (y && years.indexOf(y) === -1) years.push(y);
    });
    focusYearSelect.innerHTML = '';
    years.forEach(function (y) {
      var opt = document.createElement('option');
      opt.value = y; opt.textContent = y + ' 年';
      focusYearSelect.appendChild(opt);
    });
    if (globalFocusArticle) focusYearSelect.value = focusYearOf(globalFocusArticle);
  }

  function selectFocusYear(year) {
    var match = globalFocusCandidates.find(function (a) { return focusYearOf(a) === year; });
    if (!match) return;
    globalFocusArticle = match;
    ensureSummaries([year]).then(function () {
      renderFocusList();
      renderPreview();
      saveDraft();
    });
  }

  function cycleGlobalFocus() {
    if (!globalFocusArticle) return;
    var year = focusYearOf(globalFocusArticle);
    var group = globalFocusCandidates.filter(function (a) { return focusYearOf(a) === year; });
    if (group.length <= 1) return;
    var idx = group.indexOf(globalFocusArticle);
    globalFocusArticle = group[(idx + 1) % group.length];
    ensureSummaries([year]).then(function () {
      renderFocusList();
      renderPreview();
      saveDraft();
    });
  }

  function renderFocusList() {
    var el = $('gvm-focus-list');
    if (!globalFocusArticle) {
      el.innerHTML = '<span class="gvm-copy-hint">目前資料庫中沒有「' + sourceConfig().focusCategory + '」分類的文章。</span>';
      return;
    }
    var a = globalFocusArticle;
    el.innerHTML = '';
    var text = document.createElement('div');
    text.className = 'gvm-focus-text';
    text.textContent = a.t + '。' + cleanExcerpt(fullTextFor(a));
    var source = document.createElement('div');
    source.className = 'gvm-focus-source';
    var link = document.createElement('a');
    link.href = a.url; link.target = '_blank'; link.rel = 'noopener noreferrer';
    link.textContent = '完整報導 →';
    source.appendChild(document.createTextNode('資料來源：《' + sourceConfig().label + '》' + sourceConfig().focusCategory + '・' + (a.y || '') + '　'));
    source.appendChild(link);
    el.appendChild(text);
    el.appendChild(source);
  }

  function refreshAll() {
    renderEditList();
    renderPreview();
    saveDraft();
  }

  // 打字時每個按鍵都寫一次 localStorage 太浪費，停手約 1 秒後才存
  var draftSaveTimer = null;
  function saveDraftSoon() {
    clearTimeout(draftSaveTimer);
    draftSaveTimer = setTimeout(saveDraft, 900);
  }

  function updateIntroCount() {
    introCountEl.textContent = introEditEl.value.length + ' 字';
  }

  function generate() {
    var keyword = keywordInput.value.trim();
    if (!keyword) { setStatus('請先輸入關鍵字', true); return; }
    var count = parseInt(countSelect.value, 10);
    var yearLimit = yearSelect.value ? parseInt(yearSelect.value, 10) : 0;

    var result = searchArticles(keyword, count, yearLimit);
    var picked = result.picked;
    var exactIds = result.exactIds;
    if (!picked.length) {
      setStatus('找不到與「' + keyword + '」相關的真實文章，換個關鍵字試試？', true);
      introPanel.style.display = 'none';
      listPanel.style.display = 'none';
      utmPanel.style.display = 'none';
      state = { keyword: '', intro: '', articles: [], yearLimit: 0 };
      renderPreview();
      return;
    }

    generateBtn.disabled = true;
    setStatus('載入文章全文中…');
    var years = Array.from(new Set(picked.map(function (a) { return (a.y || '').split('/')[0]; })));
    ensureSummaries(years).then(function () {
      state.keyword = keyword;
      state.yearLimit = yearLimit;
      state.articles = picked.map(function (a) {
        return {
          i: a.i, title: a.t, summary: cleanExcerpt(fullTextFor(a)), url: a.url, y: a.y, n: a.n,
          img: a.img || '', s: a.s || '', matched: !!exactIds[a.i]
        };
      });
      state.intro = buildIntro(keyword, state.articles);

      introEditEl.value = state.intro;
      updateIntroCount();
      introPanel.style.display = 'block';
      listPanel.style.display = 'block';
      utmPanel.style.display = 'block';
      refreshAll();
      recordRecentKeyword(keyword);

      var exactCount = state.articles.filter(function (a) { return a.matched; }).length;
      var relatedCount = state.articles.length - exactCount;
      lastKeywordEl.textContent = '上次搜尋：「' + keyword + '」・' + (yearLimit ? yearLimit + '年之後' : '不限年份') + '・' + count + '篇';
      setStatus(relatedCount > 0
        ? ('已找到 ' + exactCount + ' 篇精準符合「' + keyword + '」的文章，另補上 ' + relatedCount + ' 篇同分類延伸閱讀湊到 ' + picked.length + ' 篇（資料庫共 ' + ARTICLES.length + ' 篇有摘要文章）。')
        : ('已找到 ' + picked.length + ' 篇真實文章（資料庫共 ' + ARTICLES.length + ' 篇有摘要文章）。'));
      generateBtn.disabled = false;
      showScrollHint();
    });
  }

  function showButtonFeedback(btn, msg, seconds) {
    seconds = seconds || 2;
    var badge = btn._gvmFeedbackBadge;
    if (!badge) {
      badge = document.createElement('span');
      badge.className = 'gvm-btn-feedback';
      btn.appendChild(badge);
      btn._gvmFeedbackBadge = badge;
    }
    clearInterval(btn._gvmFeedbackTimer);
    btn.disabled = true;
    var remaining = seconds;
    function tick() {
      badge.textContent = msg + '（' + remaining + '）';
      badge.classList.add('show');
      if (remaining <= 0) {
        badge.classList.remove('show');
        btn.disabled = false;
        clearInterval(btn._gvmFeedbackTimer);
        return;
      }
      remaining--;
    }
    tick();
    btn._gvmFeedbackTimer = setInterval(tick, 1000);
  }

  var scrollHintEl = $('gvm-scroll-hint');
  var scrollHintTimer = null;

  function showScrollHint() {
    if (window.innerWidth > 900) return;
    scrollHintEl.classList.remove('hide');
    scrollHintEl.classList.add('show');
    clearTimeout(scrollHintTimer);
    scrollHintTimer = setTimeout(hideScrollHint, 6000);
  }

  function hideScrollHint() {
    scrollHintEl.classList.add('hide');
    clearTimeout(scrollHintTimer);
    setTimeout(function () { scrollHintEl.classList.remove('show'); }, 250);
  }

  scrollHintEl.addEventListener('click', function () {

  window.addEventListener('scroll', function () {
    if (!scrollHintEl.classList.contains('show')) return;
    var target = document.querySelector('.gvm-preview-wrap');
    if (target && target.getBoundingClientRect().top < window.innerHeight * 0.6) {
      hideScrollHint();
    }
  }, { passive: true });

  generateBtn.addEventListener('click', generate);
  keywordInput.addEventListener('keydown', function (e) { if (e.key === 'Enter') generate(); });
  $('gvm-focus-cycle').addEventListener('click', function () {

    copyTextToClipboard(prompt,
      function () {

        showButtonFeedback(polishIntroBtn, '已複製');

  resetBtn.addEventListener('click', function () {

  editListEl.addEventListener('input', function (e) {
    var field = e.target.dataset.field, i = e.target.dataset.i;
    if (field == null || i == null) return;
    state.articles[i][field] = e.target.value;

  editListEl.addEventListener('click', function (e) {
    var btn = e.target.closest('[data-action]');
    if (!btn) return;
    var i = parseInt(btn.dataset.i, 10);
    var article = state.articles[i];
    if (!article) return;
    if (btn.dataset.action === 'move-up') {
      moveArticle(i, -1);
    } else if (btn.dataset.action === 'move-down') {
      moveArticle(i, 1);
    } else if (btn.dataset.action === 'swap') {
      swapArticle(i);
    } else if (btn.dataset.action === 'copy-link') {
      copyTextToClipboard(appendUtm(article.url),
        function () {
          recordUsedArticles([article.i]);
          showButtonFeedback(btn, '已複製');
        },
        function () { setStatus('複製失敗，請手動選取文字複製。', true); }
      );
    }
  });

  lineToggle.addEventListener('click', function () {
    var open = lineBody.classList.toggle('open');
    lineToggle.textContent = (open ? '▾' : '▸') + ' LINE 推播文字・開頭與結尾文案';

  // 推播日期每次載入都回到今天，不記在本機——記住舊日期只會複製出上一次的星期，
  // 正是這次要修掉的那類問題。
  (function setDefaultLineDate() {

  lineHeaderEl.placeholder = '第一次使用請貼上你慣用的開頭文案（專欄名稱、問候語、區塊標題…），存好之後每次打開都會自動帶回來。可用 {{星期}}、{{日期}}、{{月日}} 讓日期跟著推播日自動變。';
  lineFooterEl.placeholder = '第一次使用請貼上固定的結尾文案，例如訂閱電子報的邀請與連結。';
  [lineHeaderEl, lineFooterEl].forEach(function (el) {

  function fallbackCopyText(text) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed'; ta.style.top = '0'; ta.style.left = '0'; ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.focus(); ta.select();
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    return ok;
  }

  function copyTextToClipboard(text, onSuccess, onFailure) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(onSuccess, function () {
        if (fallbackCopyText(text)) onSuccess(); else onFailure();
      });
    } else {
      if (fallbackCopyText(text)) onSuccess(); else onFailure();
    }
  }

  copyLinksBtn.addEventListener('click', function () {
    if (!state.articles.length) return;
    var lines = state.articles.map(function (a, i) {
      return (i + 1) + '. ' + a.title + '\n' + appendUtm(a.url);
    });
    copyTextToClipboard(lines.join('\n\n'),
      function () {
        recordUsedArticles(state.articles.map(function (a) { return a.i; }));
        setStatus('已複製全部連結到剪貼簿。');
        showButtonFeedback(copyLinksBtn, '已複製');
      },
      function () { setStatus('複製失敗，請手動選取文字複製。', true); }
    );
  });

  // ---- LINE 推播純文字 --------------------------------------------------------
  // 格式對齊使用者實際在發的推播：固定開頭文案 →「1.標題／👉連結」清單 → 固定結尾文案。
  // 兩點刻意不做，是使用者確認過的決定，不要「順手優化」回去：
  //   1. 標題直接用文章卡片上的標題欄，不自動補、也不改寫「欄目前綴》」——原標題有就有、沒有就沒有。
  //   2. 不插入「編者的話」。那段是給網頁版與下載 HTML 用的，LINE 版的導言走固定文案。
  var LINE_COPY_DEFAULTS = {
    // ESG 的預設值直接取自使用者提供的真實推播原文，不是範例文案，改動前先問過本人。
    esg: {
      header: [
        '【遠見共好圈 x 趨勢咖啡Time】',
        '{{星期}}來點 #永續新知#醒腦共學',
        '',
        '各位會員好！新的一週，用一則永續新知🌍喚醒你我對ESG新想像。',
        '',
        '遠見共好圈為您整理獨家ESG國際觀點與台灣趨勢：讓永續趨勢如咖啡般香醇醒腦，掌握時下關鍵議題，陪您開啟一週滿滿永續動能！',
        '',
        '📋ESG每週趨勢觀點報導📋'
      ].join('\n'),
      footer: [
        '🌍了解更多ESG資訊，歡迎立即訂閱ESG遠見電子報：',
        'https://gvmkt.psee.io/5bjb69'
      ].join('\n')
    },
    // 遠見線上讀還沒有提供過真實的 LINE 推播範本，這裡就留空讓使用者自己填第一次，
    // 不自行編一套看起來很像、實際上沒人在用的文案。
    gvm: { header: '', footer: '' }
  };

  // 文案裡可用的日期變數。會這樣設計，是因為第一版把使用者範例裡的「週一」當成固定字串
  // 直接凍進預設文案，結果週二按下複製還是印「週一」——星期本來就是跟著發送日走的變數，
  // 不該寫死。日期取自「推播日期」欄位而非當下時間，這樣才能今天先把下週一的推播排好。
  var LINE_DATE_VARS = [
    { token: '{{星期}}', label: '{{星期}}', fn: function (d) { return '週' + '日一二三四五六'.charAt(d.getDay()); } },
    { token: '{{日期}}', label: '{{日期}}', fn: function (d) {
        return d.getFullYear() + '/' + String(d.getMonth() + 1).padStart(2, '0') + '/' + String(d.getDate()).padStart(2, '0');
      } },
    { token: '{{月日}}', label: '{{月日}}', fn: function (d) { return (d.getMonth() + 1) + '/' + d.getDate(); } }
  ];

  function lineDateValue() {
    var v = lineDateInput.value;
    var d = v ? new Date(v + 'T00:00:00') : new Date();
    return isNaN(d.getTime()) ? new Date() : d;
  }

  function fillLineDateVars(text) {
    var d = lineDateValue();
    LINE_DATE_VARS.forEach(function (v) {
      text = text.split(v.token).join(v.fn(d));
    });
    return text;
  }

  // 文案欄裡看到的是 {{星期}}，貼出去才會變成「週二」。中間這段落差最容易讓人踩雷，
  // 所以把代入後的實際結果直接寫在欄位下方，不用等複製出來才發現不對。
  function renderLineVarsHint() {
    var d = lineDateValue();
    lineVarsHintEl.textContent = '可用變數（依上方日期代入）：' +
      LINE_DATE_VARS.map(function (v) { return v.label + ' → ' + v.fn(d); }).join('　');
  }

  function lineCopyKey() { return 'gvm_line_copy_v1:' + currentSource; }

  // 第一版預設文案（把「週一」寫死的那版）。本機存檔如果與這串一字不差，代表使用者
  // 從沒編輯過、只是被動存下了舊預設值——這種情況自動換成新版；只要有一個字不同就
  // 代表是他自己寫的內容，一律不動。
  var LINE_COPY_LEGACY_HEADERS = {
    esg: [
      '【遠見共好圈 x 趨勢咖啡Time】',
      '週一來點 #永續新知#醒腦共學',
      '',
      '各位會員好！新的一週，用一則永續新知🌍喚醒你我對ESG新想像。',
      '',
      '遠見共好圈為您整理獨家ESG國際觀點與台灣趨勢：讓永續趨勢如咖啡般香醇醒腦，掌握時下關鍵議題，陪您開啟一週滿滿永續動能！',
      '',
      '📋ESG每週趨勢觀點報導📋'
    ].join('\n')
  };

  function loadLineCopy() {
    var def = LINE_COPY_DEFAULTS[currentSource] || { header: '', footer: '' };
    var saved = loadJSON(lineCopyKey(), null);
    var header = (saved && typeof saved.header === 'string') ? saved.header : def.header;
    var footer = (saved && typeof saved.footer === 'string') ? saved.footer : def.footer;

    var legacy = LINE_COPY_LEGACY_HEADERS[currentSource];
    var upgraded = !!(legacy && header === legacy);
    if (upgraded) header = def.header;

    lineHeaderEl.value = header;
    lineFooterEl.value = footer;
    // 升級後立刻寫回，否則每次載入都要再比對一次舊字串
    if (upgraded) saveLineCopy();
    renderLineVarsHint();
  }

  function saveLineCopy() {
    saveJSON(lineCopyKey(), { header: lineHeaderEl.value, footer: lineFooterEl.value });
  }

  var lineCopySaveTimer = null;
  function saveLineCopySoon() {
    clearTimeout(lineCopySaveTimer);
    lineCopySaveTimer = setTimeout(saveLineCopy, 900);
  }

  function buildLineText() {
    var blocks = [];
    var header = fillLineDateVars(lineHeaderEl.value.trim());
    if (header) blocks.push(header);
    blocks.push(state.articles.map(function (a, i) {
      return (i + 1) + '.' + a.title + '\n👉' + appendUtm(a.url);
    }).join('\n\n'));
    var footer = fillLineDateVars(lineFooterEl.value.trim());
    if (footer) blocks.push(footer);
    return blocks.join('\n\n');
  }

  function buildStandaloneDoc() {
    // 下載的 HTML 是獨立檔案，帶不走頁面上的 CSS 變數，所以這裡要把當前資料庫的
    // 配色實際字串代進去；否則在 ESG 模式下載會拿到深藍＋玫瑰金的雜誌版配色。
    var pal = sourceConfig().exportPalette;
    var css = [
      '@import url("https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap");',
      'body{margin:0;background:#fdfcfb;color:#2a2f36;font-family:"Noto Sans TC",sans-serif;}',
      '.wrap{max-width:640px;margin:0 auto;padding:40px 24px 60px;}',
      '.gvm-pv-masthead{text-align:center;margin-bottom:26px;}',
      '.gvm-pv-eyebrow{font-size:10px;letter-spacing:.3em;color:' + pal.decor + ';text-transform:uppercase;font-weight:700;margin-bottom:6px;}',
      '.gvm-pv-title{font-family:"Noto Serif TC",serif;font-weight:900;font-size:22px;color:' + pal.deep + ';margin:0 0 6px;}',
      '.gvm-pv-sub{font-size:11.5px;color:#6b7280;}',
      '.gvm-pv-date{font-size:11px;color:' + pal.soft + ';font-weight:700;letter-spacing:.05em;margin-top:8px;}',
      '.gvm-pv-rule{width:40px;height:2px;background:' + pal.decor + ';margin:14px auto 0;}',
      '.gvm-pv-section-divider{display:flex;align-items:center;gap:12px;margin:32px 0 22px;}',
      '.gvm-pv-section-divider::before,.gvm-pv-section-divider::after{content:"";flex:1;height:1px;background:' + pal.line + ';}',
      '.gvm-pv-section-divider span{font-size:10px;letter-spacing:.25em;color:' + pal.decor + ';text-transform:uppercase;font-weight:700;white-space:nowrap;}',
      '.gvm-pv-intro-wrap{margin:0 0 22px;}',
      '.gvm-pv-intro{font-family:"Noto Serif TC",serif;font-size:15.5px;font-weight:600;line-height:1.85;color:#2a2f36;border-left:3px solid ' + pal.decorLight + ';padding:6px 0 6px 16px;white-space:pre-wrap;}',
      '.gvm-pv-focus{margin:0 0 22px;}',
      '.gvm-pv-focus-label{font-size:11px;letter-spacing:.15em;color:' + pal.soft + ';text-transform:uppercase;font-weight:700;margin-bottom:8px;}',
      '.gvm-pv-focus-text{font-family:"Noto Serif TC",serif;font-size:15px;font-weight:600;line-height:1.85;color:#2a2f36;}',
      '.gvm-pv-focus-source{font-size:11px;color:#6b7280;margin-top:10px;}',
      '.gvm-pv-focus-source a{color:' + pal.soft + ';text-decoration:none;}',
      '.gvm-pv-item{display:flex;gap:16px;padding:20px 0;}',
      '.gvm-pv-item + .gvm-pv-item{border-top:1px solid ' + pal.line + ';}',
      '.gvm-pv-media{display:flex;flex-direction:column;align-items:flex-start;gap:8px;flex-shrink:0;width:76px;}',
      '.gvm-pv-num{font-family:"Noto Serif TC",serif;font-weight:700;font-size:28px;color:' + pal.decor + ';line-height:1;text-align:left;}',
      '.gvm-pv-thumb{width:76px;height:76px;border-radius:6px;object-fit:cover;background:' + pal.thumbBg + ';}',
      '.gvm-pv-body{flex:1;min-width:0;}',
      '.gvm-pv-source{font-size:10.5px;color:' + pal.soft + ';font-weight:700;letter-spacing:.04em;margin-bottom:5px;}',
      '.gvm-pv-item-title{font-family:"Noto Serif TC",serif;font-size:15px;font-weight:700;color:' + pal.deep + ';margin:0 0 6px;line-height:1.5;}',
      '.gvm-pv-summary{font-size:12.5px;line-height:1.7;color:#2a2f36;margin-bottom:8px;}',
      '.gvm-pv-link{font-size:11.5px;color:' + pal.accent + ';text-decoration:none;font-weight:700;border-bottom:1px solid ' + pal.soft + ';padding-bottom:1px;}',
      '.gvm-footnote{text-align:center;font-size:11px;color:#6b7280;margin-top:30px;padding-top:18px;border-top:1px solid ' + pal.line + ';line-height:1.7;}',
      '@media (max-width:900px){',
      '.gvm-pv-item{flex-direction:column;}',
      '.gvm-pv-media{width:100%;}',
      '.gvm-pv-thumb{width:100%;height:auto;object-fit:unset;border-radius:8px;}',
      '.gvm-pv-num{font-size:30px;}',
      '.gvm-pv-intro{border-left:none;padding-left:0;}',
      '}'
    ].join('\n');
    return '<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="UTF-8">' +
      '<meta name="viewport" content="width=device-width, initial-scale=1.0">' +
      '<title>' + escapeHtml(sourceConfig().label) + '｜' + escapeHtml(state.keyword) + '</title>' +
      '<style>' + css + '</style></head><body><div class="wrap">' + previewBody.innerHTML + '</div></body></html>';
  }

  downloadHtmlBtn.addEventListener('click', function () {
    if (!state.articles.length) return;
    var blob = new Blob([buildStandaloneDoc()], { type: 'text/html' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = sourceConfig().label + '_' + state.keyword + '_' + formatToday('') + '.html';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    recordUsedArticles(state.articles.map(function (a) { return a.i; }));
    setStatus('HTML 已下載，可直接開啟或轉發給同事。');
  });

  function updateSourceUI() {
    var cfg = sourceConfig();
    document.body.classList.toggle('source-esg', currentSource === 'esg');
    sourceGvmBtn.classList.toggle('active', currentSource === 'gvm');
    sourceEsgBtn.classList.toggle('active', currentSource === 'esg');
    keywordInput.placeholder = cfg.keywordPlaceholder;
    focusPanelLabelEl.textContent = '4・國際焦點（自動帶入，' + cfg.label + '真實報導）';
    utmSectionEl.style.display = cfg.useUtm ? 'block' : 'none';
    if (cfg.useUtm) {
      // utm_campaign 依資料庫帶不同預設值，讓 LINE 成效報表能分辨這則推播來自哪個資料庫。
      // 只在同仁沒有自己改過的情況下才覆蓋，不動手改他們手動填的值。
      var knownCampaigns = Object.keys(DATA_SOURCES)
        .map(function (k) { return DATA_SOURCES[k].utmCampaign; })
        .filter(Boolean);
      if (knownCampaigns.indexOf(utmCampaignInput.value.trim()) !== -1 || !utmCampaignInput.value.trim()) {
        utmCampaignInput.value = cfg.utmCampaign;
      }
    }
    loadLineCopy();
  }

  function clearWorkspace() {
    state = { keyword: '', intro: '', articles: [], yearLimit: 0 };
    keywordInput.value = '';
    introEditEl.value = '';
    updateIntroCount();
    introPanel.style.display = 'none';
    listPanel.style.display = 'none';
    utmPanel.style.display = 'none';
    lastKeywordEl.textContent = '';
    renderPreview();
  }

  async function loadSource(source, isSwitch) {
    currentSource = source;
    updateSourceUI();
    generateBtn.disabled = true;
    sourceCaptionEl.textContent = '資料庫載入中…';

    if (isSwitch) {
      // 換資料庫時清空目前的搜尋結果與全文快取，避免殘留另一個資料庫的內容
      clearWorkspace();
      summariesCache = {};
    }

    try {
      var res = await fetch(sourceConfig().dataUrl);
      var data = await res.json();
      ARTICLES = data.articles;
      generateBtn.disabled = false;
      var cfg = sourceConfig();
      computeYearRange();
      populateYears();
      var rangeText = dataYearRange.label ? dataYearRange.label + '・' : '';
      sourceCaptionEl.textContent = '目前資料庫：' + cfg.label + '（' + ARTICLES.length + ' 篇真實文章・' + rangeText + '零 API 呼叫）';
      setStatus('資料庫共 ' + ARTICLES.length + ' 篇有摘要文章' +
        (dataYearRange.label ? '（' + dataYearRange.label + '）' : '') + '，可開始搜尋。');
      computeGlobalFocus();
      renderHotKeywords();
      renderRecentKeywords();
    } catch (e) {
      sourceCaptionEl.textContent = '';
      setStatus('資料庫載入失敗，請重新整理頁面', true);
      console.error(e);
    }
  }

  function switchSource(source) {
    if (source === currentSource) return;
    // 已經選好文章、編好引言時，換資料庫等於整份重來——先確認過再清空，避免手滑點掉一整份工作
    if (state.articles.length) {
      var ok = window.confirm('切換到「' + DATA_SOURCES[source].label + '」會清空目前這份策展（' +
        state.articles.length + ' 篇文章與編者的話）。\n\n確定要切換嗎？');
      if (!ok) return;
    }
    clearDraft();
    loadSource(source, true);
  }

  sourceGvmBtn.addEventListener('click', function () { switchSource('gvm'); });
  sourceEsgBtn.addEventListener('click', function () { switchSource('esg'); });

  // ---- 草稿自動保存 ----------------------------------------------------------
  // 每週策展做到一半被打斷是常態，關掉分頁不該讓整份工作消失。狀態存在瀏覽器本機
  // （不上傳、不經過任何伺服器），下次打開若有未完成的草稿就問要不要接續。
  var DRAFT_KEY = 'gvm_curation_draft_v1';
  var DRAFT_MAX_AGE_DAYS = 7;
  var draftBannerEl = $('gvm-draft-banner');
  var draftTextEl = $('gvm-draft-text');
  var restoringDraft = false;

  function saveDraft() {
    if (restoringDraft) return;
    if (!state.articles.length) { clearDraft(); return; }
    saveJSON(DRAFT_KEY, {
      source: currentSource,
      keyword: state.keyword,
      yearLimit: state.yearLimit,
      intro: state.intro,
      articles: state.articles,
      focusId: globalFocusArticle ? globalFocusArticle.i : '',
      savedAt: new Date().toISOString()
    });
  }

  function clearDraft() {
    try { localStorage.removeItem(DRAFT_KEY); } catch (e) {}
    draftBannerEl.classList.remove('show');
  }

  function readDraft() {
    var d = loadJSON(DRAFT_KEY, null);
    if (!d || !d.articles || !d.articles.length || !DATA_SOURCES[d.source]) return null;
    var cutoff = new Date();
    cutoff.setDate(cutoff.getDate() - DRAFT_MAX_AGE_DAYS);
    if (new Date(d.savedAt) < cutoff) { clearDraft(); return null; }
    return d;
  }

  function formatDraftTime(iso) {
    var d = new Date(iso);
    if (isNaN(d.getTime())) return '';
    return (d.getMonth() + 1) + '/' + d.getDate() + ' ' +
      String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  }

  async function restoreDraft(draft) {
    restoringDraft = true;
    draftBannerEl.classList.remove('show');
    await loadSource(draft.source, draft.source !== currentSource);

    state.keyword = draft.keyword;
    state.yearLimit = draft.yearLimit || 0;
    state.articles = draft.articles;
    state.intro = draft.intro;

    keywordInput.value = draft.keyword;
    yearSelect.value = draft.yearLimit ? String(draft.yearLimit) : '';
    countSelect.value = String(draft.articles.length);
    introEditEl.value = draft.intro;
    updateIntroCount();
    introPanel.style.display = 'block';
    listPanel.style.display = 'block';
    utmPanel.style.display = 'block';

    if (draft.focusId) {
      var match = globalFocusCandidates.find(function (a) { return a.i === draft.focusId; });
      if (match) {
        globalFocusArticle = match;
        focusYearSelect.value = focusYearOf(match);
        await ensureSummaries([focusYearOf(match)]);
        renderFocusList();
      }
    }

    // 文章全文可能還沒載入（草稿只存卡片上已編輯好的文字，不重抓），這裡直接用草稿內容重繪
    refreshAll();
    lastKeywordEl.textContent = '上次搜尋：「' + draft.keyword + '」・' +
      (draft.yearLimit ? draft.yearLimit + '年之後' : '不限年份') + '・' + draft.articles.length + '篇';
    setStatus('已接續 ' + formatDraftTime(draft.savedAt) + ' 儲存的草稿（' + draft.articles.length + ' 篇）。');
    restoringDraft = false;
  }

  $('gvm-draft-restore').addEventListener('click', function () {
    var draft = readDraft();
    if (draft) restoreDraft(draft);
  });
  $('gvm-draft-discard').addEventListener('click', function () { clearDraft(); });

  async function init() {
    var draft = readDraft();
    await loadSource(draft ? draft.source : 'gvm', false);
    if (draft) {
      draftTextEl.innerHTML = '找到 <b>' + formatDraftTime(draft.savedAt) + '</b> 未完成的策展草稿：' +
        '<b>' + escapeHtml(DATA_SOURCES[draft.source].label) + '</b>・關鍵字「' +
        escapeHtml(draft.keyword) + '」・' + draft.articles.length + ' 篇。';
      draftBannerEl.classList.add('show');
    }
  }

  init();
</script>
</body>
</html>
